[project]
name = "qoraphase"
version = "0.1.0"
description = "A JAX-native, composable phase-retrieval framework for coherent diffraction imaging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.12"
keywords = ["phase retrieval", "coherent diffraction imaging", "CDI", "jax", "x-ray imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "jax>=0.11.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/QoraPhase"
Repository = "https://github.com/NaNIsaac/QoraPhase"
Issues = "https://github.com/NaNIsaac/QoraPhase/issues"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
