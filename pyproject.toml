[project]
name = "qoraphase"
version = "0.2.0"
description = "A JAX-native, composable phase-retrieval framework for coherent diffraction imaging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.12"
keywords = ["phase retrieval", "coherent diffraction imaging", "CDI", "jax", "x-ray imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "jax>=0.11.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/QoraPhase"
Repository = "https://github.com/NaNIsaac/QoraPhase"
Issues = "https://github.com/NaNIsaac/QoraPhase/issues"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
examples = [
    "pyvista>=0.49.1",
    "scikit-image>=0.26",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"examples/diagnose.py" = ["F841"]
"src/qoraphase/__init__.py" = ["RUF022"]
"src/qoraphase/diagnostics.py" = ["RUF046"]
"tests/test_api.py" = ["C408", "F401"]
"tests/test_detwin.py" = ["C408", "RUF059"]
"tests/test_forward_model.py" = ["RUF059"]
"tests/test_jax_transforms.py" = ["F401"]
"tests/test_postprocess.py" = ["RUF059"]
"tests/test_projections.py" = ["F401", "RUF059"]
"tests/test_shapes.py" = ["RUF059"]
"tests/test_shrinkwrap.py" = ["RUF059"]
"tests/test_validate.py" = ["F401"]
